
<!DOCTYPE html>
<html>
<head>
<title>X Gaming Zone</title>
<style>
body {
  background: #101020;
  color: white;
  text-align: center;
  font-family: Arial;
  padding: 30px;
}
h1 { color: cyan; }
button, select {
  padding: 12px 20px;
  margin: 8px;
  font-size: 18px;
  border-radius: 8px;
  cursor: pointer;
}
#clickBtn { background: cyan; }
</style>
</head>
<body>

<h1>🎮 X GAMING ZONE</h1>
<p>Welcome to my gaming website!</p>
<h2>Click Challenge</h2>

<p>Choose your time:</p>
<select id="timeChoice">
  <option value="15">15 Seconds</option>
  <option value="10">10 Seconds</option>
  <option value="5">5 Seconds</option>
</select>

<br>
<button onclick="startGame()">Start Game</button>
<button id="clickBtn" onclick="clickMe()" disabled>Click Me!</button>

<h2>Time: <span id="time">0</span></h2>
<h2>Score: <span id="score">0</span></h2>
<h3 id="message"></h3>

<script>
let score = 0;
let timeLeft = 10;
let timer;
let playing = false;

function startGame() {
  clearInterval(timer);
  score = 0;
  timeLeft = Number(document.getElementById("timeChoice").value);
  playing = true;

  document.getElementById("score").textContent = score;
  document.getElementById("time").textContent = timeLeft;
  document.getElementById("message").textContent = "Go! Go! Go!";
  document.getElementById("clickBtn").disabled = false;

  timer = setInterval(function() {
    timeLeft--;
    document.getElementById("time").textContent = timeLeft;

    if (timeLeft <= 0) {
      clearInterval(timer);
      playing = false;
      document.getElementById("clickBtn").disabled = true;
      document.getElementById("message").textContent =
        "Game Over! Your score is " + score;
    }
  }, 1000);
}

function clickMe() {
  if (playing) {
    score++;
    document.getElementById("score").textContent = score;
  }
}
</script>

</body>
</html>
